<html lang="zh-CN">
<head>

<title>摸鱼基地 - 聊天</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;width:100%;display:flex;flex-direction:column;background:#0f1730;}
body{display:flex;flex-direction:column}
.online-count{position:fixed;top:12px;right:12px;font-size:13px;color:rgba(255,255,255,0.5);z-index:99;}
.system-tip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:14px 24px;border-radius:12px;font-size:15px;z-index:9999;display:none;}
.login{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:999;}
.login-card{position:relative;z-index:10;background:rgba(255,255,255,0.06);backdrop-filter:blur(14px);border-radius:24px;border:1px solid rgba(255,255,255,0.12);padding:45px 35px;width:92%;max-width:460px;text-align:center;}
.main-title{font-size:2rem;color:#fff;font-weight:600;margin-bottom:12px;text-shadow:0 0 18px rgba(96,230,205,0.55);}
.sub-title{font-size:1.2rem;color:#c9cdd8;margin-bottom:28px;letter-spacing:1px;}
.tabs{display:flex;gap:10px;margin-bottom:16px;}
.tab{flex:1;padding:12px;text-align:center;background:rgba(255,255,255,0.1);border-radius:18px;cursor:pointer;font-weight:bold;transition:0.2s;}
.tab.active{background:linear-gradient(90deg,#5eead4,#86efac);color:#0f1730;}
.input-group{margin-bottom:22px;position:relative;}
.input-group input{width:100%;padding:18px 18px 18px 55px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:35px;color:#fff;font-size:0.8rem;outline:none;transition:0.3s ease;}

.input-group input::placeholder{color:rgba(94,234,212,0.7);font-size:0.75rem;}
 
.input-group input:focus{border-color:#5eead4;box-shadow:0 0 12px rgba(94,234,212,0.4);}
.input-group .icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.6);font-size:1.25rem;pointer-events:none;}

.input-group .required{color:#ff3b30;font-size:0.7rem;position:absolute;right:18px;top:50%;transform:translateY(-50%);} .code-row{display:flex;gap:10px;margin-bottom:22px;position:relative;} .code-row .code-input-wrap{flex:1;position:relative;} .code-row input{width:100%;padding:18px 18px 18px 55px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:35px;color:#fff;font-size:0.8rem;outline:none;transition:0.3s ease;} .code-row input::placeholder{color:rgba(94,234,212,0.7);font-size:0.75rem;} .code-row input:focus{border-color:#5eead4;box-shadow:0 0 12px rgba(94,234,212,0.4);} .code-row .icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.6);font-size:1.25rem;pointer-events:none;} .code-row .required{color:#ff3b30;font-size:0.7rem;position:absolute;right:18px;top:50%;transform:translateY(-50%);} .send-code-btn{flex-shrink:0;width:110px;padding:0;background:linear-gradient(90deg,#5eead4,#86efac);border:none;border-radius:35px;color:#0f1730;font-size:0.75rem;font-weight:bold;cursor:pointer;transition:all 0.3s ease;white-space:nowrap;} .send-code-btn:disabled{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);cursor:not-allowed;} .send-code-btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(94,234,212,0.4);}
 
.btn{width:100%;padding:17px;background:linear-gradient(90deg,#5eead4,#86efac);border:none;border-radius:35px;color:#0f1730;font-size:1.15rem;font-weight:bold;cursor:pointer;transition:all 0.3s ease;margin:0 0 12px 0;}
.btn:hover{transform:translateY(-3px);box-shadow:0 6px 25px rgba(94,234,212,0.45);}
.tip,.tip2{color:#ff3b30;text-align:center;margin-top:8px;font-size:13px;}
.container{display:none;flex:1;padding:14px;flex-direction:column;gap:10px;height:100%;min-height:0;position:relative;z-index:2;}
.header{display:flex;justify-content:space-between;align-items:center;}
.nick{font-size:20px;font-weight:600;color:#ffffff;}
.exit{background:#ff3b30;padding:6px 16px;border-radius:8px;font-size:14px;width:70px;text-align:center;}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px;}

.msg{padding:10px 14px;border-radius:16px;max-width:75%;word-break:break-all;position:relative;z-index:2;}

.input-box{display:flex;gap:8px;align-items:center;flex-shrink:0;}

.send{background:#007AFF;color:#fff;border:none;border-radius:8px;font-size:14px;width:70px;padding:6px 12px;text-align:center;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:9999;}
.modal-box{background:#222;padding:24px;border-radius:16px;width:90%;max-width:300px;}
.modal-buttons{display:flex;gap:10px;margin-top:14px;}
.modal-buttons button{flex:1;}
.media-img{max-width:240px;max-height:240px;width:auto;height:auto;border-radius:12px;cursor:pointer;object-fit:cover;}
.media-video{max-width:240px;max-height:240px;width:auto;height:auto;border-radius:12px;cursor:pointer;object-fit:cover;}
#fullPreview{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:99999;align-items:center;justify-content:center;}
#fullMedia{max-width:90vw;max-height:90vh;object-fit:contain;}
#fullVideo{max-width:90vw;max-height:90vh;object-fit:contain;}
#saveBtn{position:absolute;bottom:40px;background:#007AFF;color:#fff;padding:10px 20px;border-radius:8px;border:none;font-size:16px;}
.match-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:99999;}
.match-modal .box{background:#1a1a2e;padding:30px;border-radius:20px;text-align:center;width:80%;max-width:320px;}
.match-modal .title{font-size:18px;margin-bottom:20px;color:#fff;}
.match-modal .btn-ok{background:#007AFF;color:#fff;border:none;padding:12px 24px;border-radius:12px;margin-right:8px;}
.match-modal .btn-cancel{background:#444;color:#fff;border:none;padding:12px 24px;border-radius:12px;}
.guide-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;align-items:center;justify-content:center;}
.guide-box{background:#1a1a2e;padding:28px;border-radius:20px;width:92%;max-width:380px;text-align:center;max-height:90vh;overflow-y:auto;}
#agreementMask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999999;display:flex;align-items:center;justify-content:center;padding:15px;}
.agreement-box{background:#fff;width:100%;max-width:420px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.agreement-title{padding:15px;text-align:center;font-size:18px;font-weight:bold;color:#333;border-bottom:1px solid #eee;}
.agreement-content{padding:15px;height:320px;overflow-y:auto;font-size:13px;line-height:1.7;color:#555;}
.agreement-buttons{display:flex;border-top:1px solid #eee;}
.agreement-buttons button{flex:1;padding:14px;border:none;font-size:15px;cursor:pointer;}
#cancelBtn{background:#f5f5f5;color:#666;}
#agreeBtn{background:#409eff;color:#fff;cursor:not-allowed;}
</style>
</head>

<script>
const BASE_URL = "https://api.808.qzz.io";
const WS_PATH = BASE_URL + "/ws";
let socket = null;
let nickName = "";
let userId = "";
let partnerId = "";
let roomId = "";
let heartbeatTimer = null;
let hasOnline = false;
let guideShownCount = 0;
const MAX_GUIDE_SHOW = 3;
const HEARTBEAT_INTERVAL = 300000;
let userPhoneBrand = "通用安卓";
let userBrowserName = "浏览器";
let userBrowserAppName = "浏览器";
let isInAiRoom = false;
let codeCountdown = 0; let codeTimer = null;
const TIP_TEXT = `摸鱼基地介绍<br>聊天不留记录，看完就消失<br>账号每3个月自动清理<br>忘记账号密码，重新注册就行<br>来无痕迹，去无牵挂`;

let idleTimer = null;
const IDLE_TIME = 3600000;

document.documentElement.style.touchAction = "manipulation";
document.body.style.touchAction = "manipulation";
window.addEventListener("touchstart", () => {}, { passive: true });

function logout() {
    document.cookie.split(";").forEach(function(c) {
        let cookie = c.trim();
        if (!cookie) return;
        let eqPos = cookie.indexOf("=");
        let name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
        document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
    });
    localStorage.removeItem("chat_user_id");
    localStorage.removeItem("chat_nickname");
    sessionStorage.clear();
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    if (socket) socket.close();
    document.getElementById("main").style.display = "none";
    document.getElementById("login").style.display = "flex";
    hasOnline = false;
    userId = "";
    nickName = "";
    partnerId = "";
    roomId = "";
    clearTimeout(idleTimer);
}

function resetIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        logout();
    }, IDLE_TIME);
}

function startIdleMonitor() {
    const events = ["mousemove","keydown","click","scroll","touchstart"];
    events.forEach(ev => document.addEventListener(ev, resetIdleTimer));
    resetIdleTimer();
}

document.getElementById('defaultChatTip').innerHTML = TIP_TEXT;

function autoDetectUserEnv() {
  const ua = navigator.userAgent.toLowerCase();
  if (ua.includes("xiaomi") || ua.includes("miui") || ua.includes("redmi")) userPhoneBrand = "小米/红米";
  else if (ua.includes("vivo") || ua.includes("bbk") || ua.includes("iqoo")) userPhoneBrand = "vivo/iQOO";
  else if (ua.includes("oppo") || ua.includes("heytap") || ua.includes("realme")) userPhoneBrand = "OPPO/一加";
  else if (ua.includes("huawei") || ua.includes("honor")) userPhoneBrand = "华为/荣耀";
  else if (ua.includes("samsung")) userPhoneBrand = "三星";
  if (ua.includes("quark")) { userBrowserName = "夸克浏览器"; userBrowserAppName = "夸克"; }
  else if (ua.includes("ucbrowser")) { userBrowserName = "UC浏览器"; userBrowserAppName = "UC浏览器"; }
  else if (ua.includes("qqbrowser")) { userBrowserName = "QQ浏览器"; userBrowserAppName = "QQ浏览器"; }
  else if (ua.includes("micromessenger")) { userBrowserName = "微信内置浏览器"; userBrowserAppName = "微信"; }
  else { userBrowserName = "系统浏览器"; userBrowserAppName = "浏览器"; }
}

function getSystemStep() {
  if (userBrowserName === "微信内置浏览器") return `<p>微信限制后台，右上角「···」→「在浏览器打开」再设置</p>`;
  switch(userPhoneBrand){
    case "小米/红米":return`<p>1.设置→应用设置→${userBrowserAppName}</p><p>2.省电策略→无限制</p><p>3.开启后台联网、自启动</p>`;
    case "vivo/iQOO":return`<p>1.设置→应用与权限→${userBrowserAppName}</p><p>2.耗电管理→后台高耗电+后台运行</p>`;
    case "OPPO/一加":return`<p>1.设置→应用管理→${userBrowserAppName}</p><p>2.耗电→后台运行+无限制</p>`;
    case "华为/荣耀":return`<p>1.设置→应用→${userBrowserAppName}</p><p>2.耗电→关闭自动管理，开启后台活动</p>`;
    default:return`<p>1.设置→应用→${userBrowserAppName}</p><p>2.电池→省电策略设为无限制</p>`;
  }
}

function getBrowserStep() {
  if(userBrowserName==="夸克浏览器")return`<p>菜单→设置→通用→开启后台网页运行，关闭省电</p>`;
  if(userBrowserName==="UC浏览器")return`<p>菜单→设置→高级→开启后台应用运行</p>`;
  return`<p>浏览器菜单→设置→关闭所有省电/省流量模式</p>`;
}

function showGuideModal(isForce=false) {
  if(localStorage.getItem("guide_no_more")==="true"&&!isForce)return;
  if(guideShownCount>=MAX_GUIDE_SHOW&&!isForce)return;
  autoDetectUserEnv();
  document.getElementById("systemStep").innerHTML=getSystemStep();
  document.getElementById("browserStep").innerHTML=getBrowserStep();

function updateOnlineCount(count) {
    document.getElementById("onlineCount").textContent = `在线：${count}`;
}

function initSocket() {
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
    socket = new WebSocket(WS_PATH);
    socket.onopen = () => {
        sendHeartbeatNow();
        if (!hasOnline && userId) {
            socket.send(JSON.stringify({ type: "user-online", username: userId, nickname: nickName || userId }));
            hasOnline = true;
        }
    };
    socket.onmessage = (e) => {
        const j = JSON.parse(e.data);
        if (j.type === "system_tip") { showSystemTip(j.text); return; }
        if (j.type === "online_update") { updateOnlineCount(j.count); return; }
        if (j.type === "HEARTBEAT-ACK") return;
        if (j.type === "match-found") {
            partnerId = j.partnerId; roomId = j.roomId;
            document.getElementById("match").textContent = "取消匹配";
            sy("✅ 匹配成功：" + j.partnerName); return;
        }
        if (j.type === "partner-leave") {
            partnerId = ""; roomId = "";
            document.getElementById("match").textContent = "匹配聊天";
            sy("❌ 对方已离开"); return;
        }
        if (j.type === "new-msg") {
            aM(j.fromName, j.content, j.burn, j.msgId, j.msgType, j.content);
            if (document.getElementById("sound").checked) playBeep();
            if (document.getElementById("read").checked) socket.send(JSON.stringify({ type: "msg-read", msgId: j.msgId }));
            return;
        }
        if (j.type === "msg-read") {
            let ele = document.querySelector(`.msg[data-id="${j.msgId}"] .read`);
            if (ele) ele.textContent = "已读"; return;
        }
        if (j.type === "clear-chat-record") {
            document.getElementById("chat").innerHTML = `<div class="chat-bg-tip">${TIP_TEXT}</div>`;
            return;
        }
    };
    socket.onclose = () => { setTimeout(() => initSocket(), 3000); };
    socket.onerror = () => {};
    startHeartbeat();
}

function sendHeartbeatNow() {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ type: "HEARTBEAT" }));
}

function startHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(sendHeartbeatNow, HEARTBEAT_INTERVAL);
}

async function loadLatestNick() {

    nickName = data.nick || data.account || userId;
    document.getElementById("nick").textContent = nickName;
    localStorage.setItem("chat_nickname", nickName);
  } catch (e) {
    nickName = localStorage.getItem("chat_nickname") || userId;

  }
}

function exitAiRoom(){

async function sendMedia(e, type) {
  const file = e.target.files[0];
  if (!file) { e.target.value = ""; return; }
  const reader = new FileReader();
  reader.onload = function() {
    const base64Data = reader.result;
    if (partnerId) {
      const msgId = Date.now() + "";
      const burn = document.getElementById("burn").checked;
      socket.send(JSON.stringify({
        type: "send-msg", content: base64Data, msgType: type, burn: burn, msgId: msgId
      }));
      aM("我", "", burn, msgId, type, base64Data);
    }
  };
  reader.readAsDataURL(file);
  e.target.value = "";
}

function playBeep() {
  try { let ctx = new AudioContext(); let o = ctx.createOscillator(); let g = ctx.createGain(); o.type="sine"; o.frequency.value=660; g.gain.value=0.3; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.18); } catch(e) {}
}

function sy(text) {
  let c = document.getElementById("chat");
  let tip = document.createElement("div");
  tip.style.textAlign = "center"; tip.style.color = "#999"; tip.style.fontSize = "15px"; tip.style.margin = "10px 0";
  tip.textContent = text; c.appendChild(tip); c.scrollTop = c.scrollHeight;
}

function aM(who, text, burn = false, msgId = "", type = "text", url = "") {
  const c = document.getElementById("chat");
  const g = document.createElement("div");
  g.className = "msg " + (who === "我" ? "me" : "other");
  if (msgId) g.dataset.id = msgId;
  if (type === "image") {
    const img = document.createElement("img"); img.src = url; img.className = "media-img";
    img.onclick = () => {
      document.getElementById("fullMedia").src = url;
      document.getElementById("fullMedia").style.display = "block";
      document.getElementById("fullVideo").style.display = "none";
      document.getElementById("fullPreview").style.display = "flex";
    };
    g.appendChild(img);
  } else if (type === "video") {
    const video = document.createElement("video"); video.src = url; video.className = "media-video"; video.controls = true;
    video.onclick = () => {
      document.getElementById("fullVideo").src = url;
      document.getElementById("fullVideo").style.display = "block";
      document.getElementById("fullMedia").style.display = "none";
      document.getElementById("fullPreview").style.display = "flex";
    };
    g.appendChild(video);
  } else {
    const textDiv = document.createElement("div"); textDiv.textContent = text; g.appendChild(textDiv);
  }
  if (who === "我") { const readTag = document.createElement("div"); readTag.className = "read"; readTag.textContent = "未读"; g.appendChild(readTag); }
  if (burn) {
    g.classList.add("burn");
    let burnTip = document.createElement("div"); burnTip.className = "burn-tip"; burnTip.textContent = "焚·100秒"; g.appendChild(burnTip);
    let t = 100; let timer = setInterval(() => {
      t--; burnTip.textContent = "焚·" + t + "秒";
      if (t <= 0) { clearInterval(timer); if (g.parentNode) g.parentNode.removeChild(g); }
    }, 1000);
  }
  c.appendChild(g); c.scrollTop = c.scrollHeight;
}

async function login() {
  let u = document.getElementById("u1").value.trim();
  let p = document.getElementById("p1").value.trim();
  if (!u || !p) { document.getElementById("tip").textContent = "请输入账号密码"; setTimeout(()=>document.getElementById("tip").textContent="",2000); return; }
  userId = u;
  try {
    let res = await fetch(`${BASE_URL}/login`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    let j = await res.json();
    if (j.code === 200) {
      nickName = j.data.nickname || j.data.username || userId;
      localStorage.setItem("chat_user_id", userId);
      localStorage.setItem("chat_nickname", nickName);
      document.getElementById("nick").textContent = nickName;
      document.getElementById("login").style.display = "none";
      document.getElementById("main").style.display = "flex";
      await loadLatestNick();
      initSocket();
      startIdleMonitor();
    } else {
      document.getElementById("tip").textContent = j.msg || "登录失败";
      setTimeout(()=>document.getElementById("tip").textContent="",2000);
    }
  } catch (e) {
    document.getElementById("tip").textContent = "网络异常";
    setTimeout(()=>document.getElementById("tip").textContent="",2000);
  }
}

function sendCode() { let email = document.getElementById("regEmail").value.trim(); if (!email) { document.getElementById("tip2").textContent = "请先输入邮箱"; setTimeout(() => document.getElementById("tip2").textContent = "", 2000); return; } const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; if (!emailRe.test(email)) { document.getElementById("tip2").textContent = "邮箱格式不正确"; setTimeout(() => document.getElementById("tip2").textContent = "", 2000); return; } let btn = document.getElementById("sendCodeBtn"); btn.disabled = true; fetch(`${BASE_URL}/send-code`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email }) }).then(res => res.json()).then(j => { if (j.success) { document.getElementById("tip2").style.color = "#5eead4"; document.getElementById("tip2").textContent = "验证码已发送，请查收邮箱"; setTimeout(() => { document.getElementById("tip2").textContent = ""; document.getElementById("tip2").style.color = "#ff3b30"; }, 3000); codeCountdown = 80; btn.textContent = codeCountdown + "s"; codeTimer = setInterval(() => { codeCountdown--; if (codeCountdown <= 0) { clearInterval(codeTimer); btn.disabled = false; btn.textContent = "获取验证码"; } else { btn.textContent = codeCountdown + "s"; } }, 1000); } else { btn.disabled = false; btn.textContent = "获取验证码"; document.getElementById("tip2").textContent = j.error || j.msg || "发送失败"; setTimeout(() => document.getElementById("tip2").textContent = "", 2000); } }).catch(() => { btn.disabled = false; btn.textContent = "获取验证码"; document.getElementById("tip2").textContent = "网络异常"; setTimeout(() => document.getElementById("tip2").textContent = "", 2000); }); }

 
function register() {
  let u = document.getElementById("u2").value.trim();
  let p = document.getElementById("p2").value.trim();
  let email = document.getElementById("regEmail").value.trim();
  let code = document.getElementById("regCode").value.trim();

  if (!u || !p) {
    document.getElementById("tip2").textContent = "请输入账号密码";
    setTimeout(() => document.getElementById("tip2").textContent = "", 2000);
    return;
  }
  if (!email) {
    document.getElementById("tip2").textContent = "请输入邮箱";
    setTimeout(() => document.getElementById("tip2").textContent = "", 2000);
    return;
  }
  if (!code) {
    document.getElementById("tip2").textContent = "请输入验证码";
    setTimeout(() => document.getElementById("tip2").textContent = "", 2000);
    return;
  }

  fetch(`${BASE_URL}/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p, email: email, code: code })
  }).then(res => res.json()).then(j => {
    document.getElementById("tip2").textContent = j.msg || "注册成功";
    if (j.code === 200) {
      document.getElementById("tip2").style.color = "#5eead4";
      setTimeout(() => {
        document.getElementById("tip2").textContent = "";
        document.getElementById("tip2").style.color = "#ff3b30";
      }, 2000);
    } else {
      setTimeout(() => document.getElementById("tip2").textContent = "", 2000);
    }
  }).catch(() => {
    document.getElementById("tip2").textContent = "网络异常";
    setTimeout(() => document.getElementById("tip2").textContent = "", 2000);
  });
}


function sendMsg() {
  let t = document.getElementById("msg").value.trim();
  if (!t || !partnerId) { alert("请先匹配或进入AI房间"); return; }
  let msgId = Date.now() + "";
  let burn = document.getElementById("burn").checked;
  if (!socket || socket.readyState !== WebSocket.OPEN) { showSystemTip("消息发送失败"); return; }
  
  socket.send(JSON.stringify({
    type: "send-msg", content: t, msgType: "text", burn: burn, msgId: msgId, toId: partnerId, roomId: roomId
  }));
  aM("我", `${nickName}：${t}`, burn, msgId, "text");
  
  if (document.getElementById("sound").checked) playBeep();
  document.getElementById("msg").value = "";
}
