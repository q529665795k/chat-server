 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天基地</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.7.2/dist/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
        body{background:#1a1a2e;color:#fff;height:100vh;overflow:hidden;}
        .container{width:100%;height:100vh;display:flex;flex-direction:column;}
        /* 登录注册页 */
        .auth-box{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;}
        .auth-title{font-size:28px;margin-bottom:30px;color:#4cc9f0;}
        .auth-tab{display:flex;margin-bottom:20px;border-bottom:1px solid #444;}
        .auth-tab div{padding:10px 30px;font-size:18px;cursor:pointer;}
        .auth-tab .active{color:#4cc9f0;border-bottom:2px solid #4cc9f0;}
        .auth-input{width:80%;max-width:350px;margin:10px 0;padding:15px;border-radius:8px;border:none;background:#27293d;color:#fff;font-size:16px;}
        .auth-btn{width:80%;max-width:350px;margin-top:20px;padding:15px;border-radius:8px;border:none;background:#4cc9f0;color:#1a1a2e;font-size:18px;font-weight:bold;cursor:pointer;}
        .tip{margin-top:15px;font-size:14px;height:20px;}
        /* 聊天主页面 */
        .chat-page{display:none;width:100%;height:100vh;flex-direction:column;}
        .chat-header{height:60px;background:#27293d;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #444;}
        .chat-header .name{font-size:18px;font-weight:bold;}
        .chat-header .opt{font-size:14px;color:#aaa;cursor:pointer;}
        .chat-content{flex:1;padding:15px;overflow-y:auto;background:#16213e;}
        .msg-item{margin-bottom:15px;display:flex;}
        .msg-self{justify-content:flex-end;}
        .msg-other{justify-content:flex-start;}
        .msg-bubble{max-width:70%;padding:12px 15px;border-radius:15px;font-size:15px;word-break:break-all;}
        .msg-self .msg-bubble{background:#4cc9f0;color:#1a1a2e;border-bottom-right-radius:3px;}
        .msg-other .msg-bubble{background:#27293d;border-bottom-left-radius:3px;}
        .msg-name{font-size:12px;color:#aaa;margin-bottom:5px;}
        .chat-footer{height:80px;background:#27293d;padding:10px;display:flex;align-items:center;border-top:1px solid #444;}
        .chat-input{flex:1;height:50px;border-radius:25px;border:none;background:#16213e;color:#fff;padding:0 20px;font-size:16px;outline:none;}
        .send-btn{width:70px;height:50px;border-radius:25px;border:none;background:#4cc9f0;color:#1a1a2e;font-weight:bold;margin-left:10px;cursor:pointer;}
        /* 匹配弹窗 */
        .match-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:999;}
        .match-box{width:80%;max-width:300px;background:#27293d;border-radius:15px;padding:30px;text-align:center;}
        .match-text{font-size:18px;margin-bottom:25px;}
        .match-btn{padding:12px 30px;border-radius:8px;border:none;background:#4cc9f0;color:#1a1a2e;font-size:16px;cursor:pointer;margin:5px;}
        .clear-btn{background:#e63946;}
    </style>
</head>
<body>
    <!-- 登录注册区域 -->
    <div class="auth-box" id="authBox">
        <div class="auth-title">聊天基地</div>
        <div class="auth-tab">
            <div class="active" onclick="switchAuth('login')">登录</div>
            <div onclick="switchAuth('reg')">注册</div>
        </div>
        <input type="text" class="auth-input" id="u1" placeholder="请输入账号">
        <input type="password" class="auth-input" id="p1" placeholder="请输入密码">
        <input type="text" class="auth-input" id="u2" placeholder="请输入账号" style="display:none;">
        <input type="password" class="auth-input" id="p2" placeholder="请输入密码" style="display:none;">
        <button class="auth-btn" id="loginBtn" onclick="L()">登录</button>
        <button class="auth-btn" id="regBtn" onclick="R()" style="display:none;">注册</button>
        <div class="tip" id="tip1"></div>
        <div class="tip" id="tip2"></div>
    </div>

    <!-- 聊天主页面 -->
    <div class="chat-page" id="chatPage">
        <div class="chat-header">
            <div class="name" id="partnerName">等待匹配...</div>
            <div class="opt" onclick="openMatch()">匹配聊天</div>
        </div>
        <div class="chat-content" id="chatContent"></div>
        <div class="chat-footer">
            <input type="text" class="chat-input" id="msgInput" placeholder="输入消息..." onkeydown="if(event.keyCode===13)sendMsg()">
            <button class="send-btn" onclick="sendMsg()">发送</button>
        </div>
    </div>

    <!-- 匹配弹窗 -->
    <div class="match-modal" id="matchModal">
        <div class="match-box">
            <div class="match-text" id="matchText">正在匹配中...</div>
            <button class="match-btn" onclick="stopMatch()">停止匹配</button>
            <button class="match-btn clear-btn" onclick="clearChat()">清空聊天</button>
        </div>
    </div>

    <script>
        // ====================== 核心配置（和后端严格对齐） ======================
        const BACKEND_URL = "https://im6.qzz.io"; // 你的Worker后端地址
        const HEARTBEAT_INTERVAL = 25000; // 和后端心跳完全匹配：25秒一次
        let socket;
        let userId = "";
        let nickName = "";
        let heartbeatTimer = null;
        let hasOnline = false;
        let isMatched = false;

        // ====================== 登录/注册切换 ======================
        function switchAuth(type) {
            if(type === "login"){
                document.getElementById("u1").style.display = "block";
                document.getElementById("p1").style.display = "block";
                document.getElementById("loginBtn").style.display = "block";
                document.getElementById("tip1").style.display = "block";
                document.getElementById("u2").style.display = "none";
                document.getElementById("p2").style.display = "none";
                document.getElementById("regBtn").style.display = "none";
                document.getElementById("tip2").style.display = "none";
                document.querySelectorAll(".auth-tab div")[0].classList.add("active");
                document.querySelectorAll(".auth-tab div")[1].classList.remove("active");
            }else{
                document.getElementById("u1").style.display = "none";
                document.getElementById("p1").style.display = "none";
                document.getElementById("loginBtn").style.display = "none";
                document.getElementById("tip1").style.display = "none";
                document.getElementById("u2").style.display = "block";
                document.getElementById("p2").style.display = "block";
                document.getElementById("regBtn").style.display = "block";
                document.getElementById("tip2").style.display = "block";
                document.querySelectorAll(".auth-tab div")[0].classList.remove("active");
                document.querySelectorAll(".auth-tab div")[1].classList.add("active");
            }
        }

        // ====================== ✅ 登录接口（精准适配D1分步校验） ======================
        function L() {
            let u = document.getElementById("u1").value.trim();
            let p = document.getElementById("p1").value.trim();
            if (!u || !p) { 
                document.getElementById("tip1").textContent = "请输入账号密码"; 
                setTimeout(()=>document.getElementById("tip1").textContent="",2000); 
                return; 
            }
            fetch(BACKEND_URL + "/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: u, password: p })
            }).then(res => res.json()).then(j => {
                if(j.code === 200){
                    // ✅ 登录成功：绑定D1用户信息，初始化KV+WebSocket
                    userId = j.data.username;
                    nickName = j.data.nickname;
                    initSocket(); // 启动WebSocket
                    document.getElementById("authBox").style.display = "none";
                    document.getElementById("chatPage").style.display = "flex";
                }else{
                    // ✅ 精准显示后端D1返回：账号不存在 / 密码错误
                    document.getElementById("tip1").textContent = "❌ " + j.msg;
                    setTimeout(()=>document.getElementById("tip1").textContent="",3000);
                }
            }).catch(()=>{
                document.getElementById("tip1").textContent = "❌ 网络异常，无法连接服务器";
                setTimeout(()=>document.getElementById("tip1").textContent="",3000);
            });
        }

        // ====================== ✅ 注册接口（适配D1防重复注册） ======================
        function R() {
            let u = document.getElementById("u2").value.trim();
            let p = document.getElementById("p2").value.trim();
            if (!u || !p) { 
                document.getElementById("tip2").textContent = "请输入账号密码"; 
                setTimeout(()=>document.getElementById("tip2").textContent="",2000); 
                return; 
            }
            fetch(BACKEND_URL + "/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: u, password: p })
            }).then(res => res.json()).then(j => {
                if(j.code === 200){
                    document.getElementById("tip2").textContent = "✅ " + j.msg;
                    setTimeout(()=>{
                        switchAuth("login");
                        document.getElementById("u1").value = u;
                    },1500);
                }else{
                    // ✅ 接收后端D1重复账号提示
                    document.getElementById("tip2").textContent = "❌ " + j.msg;
                }
                setTimeout(()=>document.getElementById("tip2").textContent="",3000);
            }).catch(()=>{
                document.getElementById("tip2").textContent = "❌ 网络异常";
                setTimeout(()=>document.getElementById("tip2").textContent="",3000);
            });
        }

        // ====================== ✅ WebSocket初始化（100%适配KV互踢+D1在线状态） ======================
        function initSocket() {
            // 连接后端WebSocket
            socket = io(BACKEND_URL + "/ws");
            
            // 连接成功：触发上线（只传username，严格匹配后端KV绑定）
            socket.on("connect", () => {
                sendHeartbeatNow();
                if (!hasOnline && userId) {
                    socket.emit("user-online", { username: userId });
                    hasOnline = true;
                }
                startHeartbeat(); // 启动心跳
            });

            // ✅ 后端心跳回复（同步KV在线时间）
            socket.on("pong", () => {});

            // ✅ 匹配成功（和后端匹配逻辑完全对齐）
            socket.on("match-found", (data) => {
                isMatched = true;
                document.getElementById("partnerName").textContent = data.partnerName;
                document.getElementById("matchModal").style.display = "none";
                addSystemMsg("✅ 匹配成功，开始聊天吧！");
            });

            // ✅ 对方离开聊天（后端心跳超时/KV离线触发）
            socket.on("partner-leave", () => {
                isMatched = false;
                document.getElementById("partnerName").textContent = "等待匹配...";
                addSystemMsg("❌ 对方已离开聊天");
            });

            // ✅ 接收新消息（D1消息库同步）
            socket.on("new-msg", (data) => {
                addOtherMsg(data.fromName, data.content);
            });

            // ✅ 清空聊天记录
            socket.on("clear-chat-record", () => {
                document.getElementById("chatContent").innerHTML = "";
            });

            // 连接断开（KV离线清理）
            socket.on("disconnect", () => {
                hasOnline = false;
                isMatched = false;
                clearInterval(heartbeatTimer);
            });
        }

        // ====================== ✅ 心跳机制（和后端3分钟保活完全对齐，适配KV） ======================
        function sendHeartbeatNow() {
            if (socket && socket.connected && userId) {
                socket.emit("HEARTBEAT");
            }
        }
        function startHeartbeat() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(() => {
                sendHeartbeatNow();
            }, HEARTBEAT_INTERVAL);
        }

        // ====================== 匹配聊天逻辑（适配后端匹配池） ======================
        function openMatch() {
            if(isMatched) return;
            document.getElementById("matchModal").style.display = "flex";
            socket.emit("match-chat");
        }
        function stopMatch() {
            socket.emit("stop-chat");
            document.getElementById("matchModal").style.display = "none";
            addSystemMsg("已停止匹配");
        }

        // ====================== 发送消息（D1消息入库+转发） ======================
        function sendMsg() {
            let content = document.getElementById("msgInput").value.trim();
            if(!content || !isMatched || !socket) return;
            socket.emit("send-msg", {
                type: "text",
                content: content,
                msgId: Date.now()
            });
            addSelfMsg(content);
            document.getElementById("msgInput").value = "";
        }

        // ====================== 清空聊天 ======================
        function clearChat() {
            socket.emit("clear-chat");
            document.getElementById("chatContent").innerHTML = "";
            document.getElementById("matchModal").style.display = "none";
        }

        // ====================== 消息渲染 ======================
        function addSelfMsg(content) {
            let html = `
                <div class="msg-item msg-self">
                    <div class="msg-bubble">${content}</div>
                </div>
            `;
            document.getElementById("chatContent").innerHTML += html;
            document.getElementById("chatContent").scrollTop = document.getElementById("chatContent").scrollHeight;
        }
        function addOtherMsg(name, content) {
            let html = `
                <div class="msg-item msg-other">
                    <div>
                        <div class="msg-name">${name}</div>
                        <div class="msg-bubble">${content}</div>
                    </div>
                </div>
            `;
            document.getElementById("chatContent").innerHTML += html;
            document.getElementById("chatContent").scrollTop = document.getElementById("chatContent").scrollHeight;
        }
        function addSystemMsg(text) {
            let html = `<div style="text-align:center;color:#aaa;margin:10px 0;font-size:12px;">${text}</div>`;
            document.getElementById("chatContent").innerHTML += html;
        }
    </script>
</body>
</html>
